<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - DM Furniture</title>
    <link rel="icon" href="image/icon.jpg">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="authModal" class="modal-overlay modal-hidden">
        <div class="modal-box">
            <span class="close-modal" onclick="closeAuthModal()">×</span>
            <h2 class="logo">DM <span>FURNITURE</span></h2>
            
            <div id="loginForm">
                <h3 style="margin-bottom:15px;">Sign In</h3>
                <input type="email" id="loginEmail" class="form-control" placeholder="Email Address" style="margin-bottom:10px;">
                <input type="password" id="loginPass" class="form-control" placeholder="Password" style="margin-bottom:5px;">
                <div style="text-align: right; margin-bottom: 15px;">
                    <span style="font-size: 0.8rem; color: var(--primary-coral); cursor: pointer; text-decoration: underline;" onclick="toggleAuth('reset')">Forgot Password?</span>
                </div>
                <button class="btn btn-primary" style="width:100%" id="btnLogin">Login</button>
                <div class="auth-toggle">New here? <span onclick="toggleAuth('signup')">Create Account</span></div>
            </div>

            <div id="signupForm" style="display:none;">
                <h3 style="margin-bottom:15px;">Create Account</h3>
                <input type="text" id="regName" class="form-control" placeholder="Full Name" style="margin-bottom:10px;">
                <input type="email" id="regEmail" class="form-control" placeholder="Email Address" style="margin-bottom:10px;">
                <input type="password" id="regPass" class="form-control" placeholder="Password (6+ chars)" style="margin-bottom:15px;">
                <button class="btn btn-secondary" style="width:100%" id="btnSignup">Sign Up</button>
                <div class="auth-toggle">Already have an account? <span onclick="toggleAuth('login')">Login</span></div>
            </div>

            <div id="resetForm" style="display:none;">
                <h3 style="margin-bottom:10px;">Reset Password</h3>
                <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">Enter your email to receive a reset link.</p>
                <input type="email" id="resetEmail" class="form-control" placeholder="Enter your email" style="margin-bottom:15px;">
                <button class="btn btn-primary" style="width:100%" id="btnReset">Send Reset Link</button>
                <div class="auth-toggle">Back to <span onclick="toggleAuth('login')">Login</span></div>
            </div>
        </div>
    </div>

    <header>
        <div class="top-bar">Made to Order | Cebu City Delivery</div>
        <div class="container main-header">
            <a href="index.html" class="logo">DM<span>FURNITURE</span></a>
            <div class="menu-icons">
                <a href="index.html" class="menu-item"><i class="fas fa-home"></i> <span>Home</span></a>
                <a href="index.html#cart" class="menu-item"><i class="fas fa-shopping-cart"></i> <span>Cart</span></a>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">
        <a href="index.html" class="back-link">← Back to Shop</a>
        
        <div id="detailContainer" class="product-detail-card">
            <p style="padding: 20px;">Loading details...</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const FB_PAGE_ID = "333976940278056"; 

        const firebaseConfig = {
            apiKey: "AIzaSyBp-ZLjO-9szI_jA09ha6lLfdDfEBpSLkM",
            authDomain: "dmfurniture-93a59.firebaseapp.com",
            projectId: "dmfurniture-93a59",
            storageBucket: "dmfurniture-93a59.firebasestorage.app",
            messagingSenderId: "844358558442",
            appId: "1:844358558442:web:604ea44d6a15482ab0ad93",
            measurementId: "G-G1JJBT9CR7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let currentUser = null;
        let selectedColor = null;
        let selectedSizeName = null;
        let currentPrice = 0; 
        let currentProduct = null;

        onAuthStateChanged(auth, (user) => { 
            currentUser = user; 
            if(user) closeAuthModal(); 
        });

        async function loadProductDetails() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            if(!id) { 
                document.getElementById('detailContainer').innerHTML = "<p>No product selected.</p>"; 
                return; 
            }

            try {
                const docSnap = await getDoc(doc(db, "products", id));
                if (docSnap.exists()) {
                    currentProduct = { id: docSnap.id, ...docSnap.data() };
                    renderHTML(currentProduct);
                } else {
                    document.getElementById('detailContainer').innerHTML = "<p>Product not found.</p>";
                }
            } catch (e) { console.error(e); }
        }

        function renderHTML(p) {
            // HANDLE MULTIPLE IMAGES
            let images = Array.isArray(p.img) ? p.img : [p.img];
            let mainImg = images[0];

            let thumbnailsHtml = '';
            if (images.length > 1) {
                thumbnailsHtml = `<div class="thumbnail-row">
                    ${images.map((img, index) => 
                        `<img src="${img}" onclick="window.changeMainImage('${img}')">`
                    ).join('')}
                </div>`;
            }

            const colorsHtml = p.colors && p.colors.length > 0 
                ? p.colors.map(c => `<button class="color-btn" onclick="window.selectColor(this, '${c}')">${c}</button>`).join('') 
                : '<span style="color:#888;">Standard</span>';

            let sizesHtml = '<span style="color:#888;">Standard</span>';
            let priceDisplay = `₱${Number(p.price).toLocaleString()}`;
            
            if (p.sizes && p.sizes.length > 0) {
                if (typeof p.sizes[0] === 'object') {
                    const prices = p.sizes.map(s => s.price);
                    const min = Math.min(...prices);
                    const max = Math.max(...prices);
                    priceDisplay = (min === max) ? `₱${min.toLocaleString()}` : `₱${min.toLocaleString()} - ₱${max.toLocaleString()}`;
                    sizesHtml = p.sizes.map(s => 
                        `<button class="color-btn size-btn" onclick="window.selectSize(this, '${s.name}', ${s.price})">${s.name}</button>`
                    ).join('');
                } else {
                    sizesHtml = p.sizes.map(s => 
                        `<button class="color-btn size-btn" onclick="window.selectSize(this, '${s}', ${p.price})">${s}</button>`
                    ).join('');
                }
            }

            const html = `
                <div class="detail-layout">
                    <div class="detail-left">
                        <img id="mainImageDisplay" src="${mainImg}" alt="${p.name}" class="main-img" onerror="this.src='https://via.placeholder.com/400'">
                        ${thumbnailsHtml}
                    </div>
                    <div class="detail-right">
                        <h1 class="p-title">${p.name}</h1>
                        <div class="p-price" id="displayPrice">${priceDisplay}</div>
                        
                        <div class="p-section">
                            <label>Color:</label>
                            <div class="color-options">${colorsHtml}</div>
                            <div id="customColorContainer" style="display:none; margin-top:10px;">
                                <input type="text" id="customColorInput" class="form-control" placeholder="Please specify your desired color...">
                            </div>
                        </div>

                        <div class="p-section">
                            <label>Size:</label>
                            <div class="color-options">${sizesHtml}</div>
                        </div>

                        <small id="selectionError" style="color:red; display:none; margin-bottom:15px; display:block; min-height:20px;"></small>

                        <div class="p-actions" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px;">
                            <button class="btn btn-outline btn-lg" onclick="window.addToCart()" style="flex: 1;">Add To Cart</button>
                            <button class="btn btn-buy-now btn-lg" onclick="window.orderNow()" style="flex: 1;">Order Now</button>
                            <button class="btn btn-messenger btn-lg" onclick="window.buyViaMessenger()" style="flex: 1; background-color: #0084FF; color: white; border:none; min-width: 100%;">
                                <i class="fab fa-facebook-messenger"></i> Messenger
                            </button>
                        </div>

                        <div class="p-section">
                            <label style="font-size: 1.1rem; border-bottom: 2px solid #eee; padding-bottom: 10px; display: block; margin-bottom: 15px;">Description</label>
                            <p class="p-desc">${p.desc}</p>
                        </div>

                    </div>
                </div>
            `;
            document.getElementById('detailContainer').innerHTML = html;
            currentPrice = p.price; 
            currentProduct.img = mainImg; 
        }

        window.changeMainImage = (src) => {
            document.getElementById('mainImageDisplay').src = src;
            currentProduct.img = src;
        };

        window.selectColor = (btn, color) => {
            selectedColor = color;
            document.querySelectorAll('.color-btn:not(.size-btn)').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('selectionError').style.display = 'none';

            const customContainer = document.getElementById('customColorContainer');
            if (color === 'Others') {
                customContainer.style.display = 'block';
                document.getElementById('customColorInput').focus();
            } else {
                customContainer.style.display = 'none';
                document.getElementById('customColorInput').value = "";
            }
        };

        window.selectSize = (btn, sizeName, price) => {
            selectedSizeName = sizeName;
            currentPrice = price; 
            document.getElementById('displayPrice').innerText = `₱${Number(price).toLocaleString()}`;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('selectionError').style.display = 'none';
        };

        function getFinalColor() {
            if (selectedColor === 'Others') {
                const customText = document.getElementById('customColorInput').value.trim();
                if (!customText) return null;
                return `Others: ${customText}`;
            }
            return selectedColor;
        }

        window.addToCart = async () => {
            if (!currentUser) { document.getElementById('authModal').classList.remove('modal-hidden'); return; }
            
            if (currentProduct.colors && currentProduct.colors.length > 0) {
                if (!selectedColor) { showError("Please select a color."); return; }
                if (selectedColor === 'Others' && !document.getElementById('customColorInput').value.trim()) {
                    showError("Please specify the color in the text box."); return;
                }
            }
            if (currentProduct.sizes && currentProduct.sizes.length > 0 && !selectedSizeName) {
                showError("Please select a size."); return;
            }

            const finalColorStr = getFinalColor() || "Standard";

            try {
                const userRef = doc(db, "users", currentUser.uid);
                const cartItem = {
                    id: currentProduct.id,
                    name: currentProduct.name,
                    price: currentPrice,
                    img: currentProduct.img,
                    color: finalColorStr,
                    size: selectedSizeName || "Standard",
                    qty: 1
                };
                await setDoc(userRef, { cart: arrayUnion(cartItem) }, { merge: true });
                alert(`Added ${currentProduct.name} to Cart!`);
            } catch (e) { alert("Error: " + e.message); }
        };

        window.orderNow = async () => {
            if (!currentUser) { document.getElementById('authModal').classList.remove('modal-hidden'); return; }
            
            if (currentProduct.colors && currentProduct.colors.length > 0) {
                if (!selectedColor) { showError("Please select a color."); return; }
                if (selectedColor === 'Others' && !document.getElementById('customColorInput').value.trim()) {
                    showError("Please specify the color in the text box."); return;
                }
            }
            if (currentProduct.sizes && currentProduct.sizes.length > 0 && !selectedSizeName) {
                showError("Please select a size."); return;
            }

            const finalColorStr = getFinalColor() || "Standard";

            try {
                const userRef = doc(db, "users", currentUser.uid);
                const cartItem = {
                    id: currentProduct.id,
                    name: currentProduct.name,
                    price: currentPrice,
                    img: currentProduct.img,
                    color: finalColorStr,
                    size: selectedSizeName || "Standard",
                    qty: 1
                };
                await setDoc(userRef, { cart: arrayUnion(cartItem) }, { merge: true });
                window.location.href = "index.html#checkout";
            } catch (e) { alert("Error: " + e.message); }
        };

        window.buyViaMessenger = () => {
            const finalColorStr = getFinalColor() || selectedColor || "";
            const variantText = (finalColorStr ? `Color: ${finalColorStr}` : '') + (selectedSizeName ? `\nSize: ${selectedSizeName}` : '');
            const message = `Hi, I'm interested in:\nProduct: ${currentProduct.name}\nPrice: ₱${Number(currentPrice).toLocaleString()}\n${variantText}\n\nIs this available?`;
            
            navigator.clipboard.writeText(message).then(() => {
                alert("Order details copied! Opening Messenger...");
                window.open(`https://m.me/${FB_PAGE_ID}`, '_blank');
            }).catch(() => window.open(`https://m.me/${FB_PAGE_ID}`, '_blank'));
        };

        function showError(msg) {
            const el = document.getElementById('selectionError');
            el.innerText = msg;
            el.style.display = 'block';
        }

        window.openAuthModal = () => document.getElementById('authModal').classList.remove('modal-hidden');
        window.closeAuthModal = () => document.getElementById('authModal').classList.add('modal-hidden');
        
        window.toggleAuth = (view) => {
            document.getElementById('loginForm').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('signupForm').style.display = view === 'signup' ? 'block' : 'none';
            document.getElementById('resetForm').style.display = view === 'reset' ? 'block' : 'none';
        };

        document.getElementById('btnSignup').addEventListener('click', async () => {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(userCredential.user, { displayName: name });
                await setDoc(doc(db, "users", userCredential.user.uid), {
                    name: name, email: email, cart: [], orders: []
                });
                alert("Welcome " + name + "!");
                closeAuthModal();
            } catch (error) { alert("Error: " + error.message); }
        });

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                alert("Login Successful!");
                closeAuthModal();
            } catch (error) { alert("Login Failed: " + error.message); }
        });

        document.getElementById('btnReset').addEventListener('click', async () => {
            const email = document.getElementById('resetEmail').value;
            if(!email) return alert("Please enter email");
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Reset link sent!");
                toggleAuth('login');
            } catch(e) { alert(e.message); }
        });

        loadProductDetails();
    </script>
</body>
</html>
